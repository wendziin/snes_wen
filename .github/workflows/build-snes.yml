name: Build Snes9x EX+ Cloud Edition

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout libcurl-android-ios
        uses: actions/checkout@v4
        with:
          repository: gustavogenovese/curl-android-ios
          path: curl-repo

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Instalamos as libs no Ubuntu (caso o SDK precise delas para ferramentas de host durante o build)
          sudo apt-get install -y ninja-build pkg-config libarchive-dev liblzma-dev
          # Instalar CMake mais recente (exigido pelo Imagine SDK)
          wget -qO- https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-x86_64.tar.gz | sudo tar --strip-components=1 -xzC /usr/local

      - name: Prepare libcurl & OpenSSL libs
        run: |
          mkdir -p $HOME/imagine-sdk/android-libs
          mkdir -p $HOME/imagine-sdk/include
          
          # Localizando as bibliotecas estáticas (.a) para arm64-v8a
          # No repo gustavogenovese/curl-android-ios elas ficam em prebuilt-with-ssl/android/arm64-v8a/
          FIND_PATH=$(find curl-repo -name "libcurl.a" | grep "arm64-v8a" | head -n 1)
          if [ -z "$FIND_PATH" ]; then
            echo "Erro: libcurl.a não encontrada!"
            exit 1
          fi
          LIB_DIR=$(dirname "$FIND_PATH")
          cp $LIB_DIR/*.a $HOME/imagine-sdk/android-libs/
          
          # Localizando os includes
          # No repo gustavogenovese eles ficam em prebuilt-with-ssl/include/
          INCLUDE_PATH=$(find curl-repo -name "curl" -type d | grep "include/curl" | head -n 1)
          INCLUDE_BASE=$(dirname "$INCLUDE_PATH")
          cp -r $INCLUDE_BASE/* $HOME/imagine-sdk/include/
          
          echo "Libs preparadas em $HOME/imagine-sdk/android-libs/"
          ls -l $HOME/imagine-sdk/android-libs/

          # --- CORREÇÃO DO PKG_CONFIG PARA ANDROID ---
          # Força o pkg-config a buscar as configurações dentro do NDK do Android
          export PKG_CONFIG_SYSROOT_DIR="${ANDROID_NDK_HOME}/sysroot"
          
          # Passa as variáveis para os próximos passos do GitHub Actions
          echo "PKG_CONFIG_SYSROOT_DIR=${ANDROID_NDK_HOME}/sysroot" >> $GITHUB_ENV

      - name: Build Imagine SDK
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd imagine
          ./android.sh install

      - name: Build EmuFramework
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd EmuFramework
          ./android.sh install

      - name: Build Snes9x EX+
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd Snes9x
          ./android.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snes9x-EX-Plus-Cloud-Edition
          path: Snes9x/build/android/src/main/outputs/apk/release/*.apk
          
