name: Build Snes9x EX+ Cloud Edition

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout libcurl-android-ios
        uses: actions/checkout@v4
        with:
          repository: gustavogenovese/curl-android-ios
          path: curl-repo

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          # Downgrade para o CMake 3.29.8 para manter compatibilidade com projetos antigos (xz e libarchive)
          wget -qO- https://github.com/Kitware/CMake/releases/download/v3.29.8/cmake-3.29.8-linux-x86_64.tar.gz | sudo tar --strip-components=1 -xzC /usr/local

      - name: Build Dependencies (curl, lzma, archive)
        run: |
          SDK_DIR="${{ github.workspace }}/imagine-sdk/android-arm64"
          mkdir -p $SDK_DIR/lib/pkgconfig
          mkdir -p $SDK_DIR/include
          
          # 1. Copiar cURL pré-compilado
          FIND_PATH=$(find curl-repo -name "libcurl.a" | grep "arm64-v8a" | head -n 1)
          if [ -z "$FIND_PATH" ]; then
            echo "Erro: libcurl.a não encontrada!"
            exit 1
          fi
          cp $(dirname "$FIND_PATH")/*.a $SDK_DIR/lib/
          cp -r $(dirname "$(find curl-repo -name "curl" -type d | grep "include/curl" | head -n 1)")/* $SDK_DIR/include/
          
          # 2. Compilar liblzma (xz) usando modo seguro do CMake (-S e -B)
          wget -qO xz.tar.gz https://github.com/tukaani-project/xz/archive/refs/tags/v5.4.4.tar.gz
          tar xzf xz.tar.gz
          cmake -S xz-5.4.4 -B xz-5.4.4/build \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$SDK_DIR -DBUILD_SHARED_LIBS=OFF
          cmake --build xz-5.4.4/build -j$(nproc)
          cmake --install xz-5.4.4/build
          
          # 2.5 Gerar liblzma.pc manualmente (CMake não o gera automaticamente no xz v5.4.4)
          echo "prefix=$SDK_DIR" > $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'exec_prefix=${prefix}' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'libdir=${exec_prefix}/lib' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'includedir=${prefix}/include' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo '' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'Name: liblzma' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'Description: General purpose data compression library' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'URL: https://tukaani.org/xz/' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'Version: 5.4.4' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'Cflags: -I${includedir}' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          echo 'Libs: -L${libdir} -llzma' >> $SDK_DIR/lib/pkgconfig/liblzma.pc
          
          # 3. Compilar libarchive usando modo seguro do CMake (-S e -B)
          wget -qO libarchive.tar.gz https://github.com/libarchive/libarchive/archive/refs/tags/v3.7.2.tar.gz
          tar xzf libarchive.tar.gz
          cmake -S libarchive-3.7.2 -B libarchive-3.7.2/build \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$SDK_DIR -DENABLE_TEST=OFF -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF
          cmake --build libarchive-3.7.2/build -j$(nproc)
          cmake --install libarchive-3.7.2/build
          
          # 4. Configurar ambiente para o projeto principal
          echo "PKG_CONFIG_PATH=$SDK_DIR/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
          echo "ANDROID_PLATFORM=android-24" >> $GITHUB_ENV
          echo "ANDROID_STL=c++_shared" >> $GITHUB_ENV
          echo "CMAKE_CXX_STANDARD=23" >> $GITHUB_ENV

      - name: Patch Imagine Framework (Source Code Fixes)
        run: |
          echo "Limpando flags que bloqueiam os headers nativos do Android NDK..."
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" -o -name "*.sh" -o -name "*.mk" \) -exec sed -i 's/-nostdinc++//g' {} +
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" -o -name "*.sh" -o -name "*.mk" \) -exec sed -i 's/-nostdinc//g' {} +
          
          echo "Aplicando downgrade global de flat_set para set em todos os arquivos de código..."
          find . -type f \( -name "*.h" -o -name "*.hh" -o -name "*.cc" -o -name "*.cpp" \) -exec sed -i 's/<flat_set>/<set>/g' {} +
          find . -type f \( -name "*.h" -o -name "*.hh" -o -name "*.cc" -o -name "*.cpp" \) -exec sed -i 's/std::flat_multiset/std::multiset/g' {} +
          find . -type f \( -name "*.h" -o -name "*.hh" -o -name "*.cc" -o -name "*.cpp" \) -exec sed -i 's/std::flat_set/std::set/g' {} +

      - name: Build Imagine SDK
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd imagine
          ./android.sh install

      - name: Build EmuFramework
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd EmuFramework
          ./android.sh install

      - name: Build Snes9x EX+
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd Snes9x
          ./android.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snes9x-EX-Plus-Cloud-Edition
          path: Snes9x/build/android/src/main/outputs/apk/release/*.apk
