name: Build Snes9x EX+ Cloud Edition

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Fetch Pre-compiled libcurl & OpenSSL for Android
        run: |
          mkdir -p $HOME/imagine-sdk/android-libs
          mkdir -p $HOME/imagine-sdk/include
          # Baixando o repositório como tarball (Pula a exigência de login do Git)
          curl -L https://github.com/mpx/curl-android-ios/archive/refs/heads/master.tar.gz -o curl-repo.tar.gz
          tar -xzf curl-repo.tar.gz
          
          # Localizando as bibliotecas estáticas (.a) para arm64-v8a
          # O tar extrai para uma pasta chamada curl-android-ios-master
          FIND_PATH=$(find curl-android-ios-master -name "libcurl.a" | grep "arm64-v8a" | head -n 1)
          LIB_DIR=$(dirname "$FIND_PATH")
          cp $LIB_DIR/*.a $HOME/imagine-sdk/android-libs/
          
          # Localizando os includes
          INCLUDE_PATH=$(find curl-android-ios-master -name "curl" -type d | grep "include/curl" | head -n 1)
          INCLUDE_BASE=$(dirname "$INCLUDE_PATH")
          cp -r $INCLUDE_BASE/* $HOME/imagine-sdk/include/
          
          ls -R $HOME/imagine-sdk/android-libs/

      - name: Build Imagine SDK
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd imagine
          ./android.sh install

      - name: Build EmuFramework
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd EmuFramework
          ./android.sh install

      - name: Build Snes9x EX+
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd Snes9x
          ./android.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snes9x-EX-Plus-Cloud-Edition
          path: Snes9x/build/android/src/main/outputs/apk/release/*.apk
