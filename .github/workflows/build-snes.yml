name: Build Snes9x EX+ Cloud Edition

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Fetch Pre-compiled libcurl & OpenSSL for Android
        run: |
          mkdir -p $HOME/imagine-sdk/android-libs
          # Baixando libs do projeto curl-android-ios (referência técnica anterior)
          curl -L https://github.com/mpx/curl-android-ios/releases/download/v8.7.1/curl-android-ios.tar.gz -o curl.tar.gz
          tar -xzf curl.tar.gz
          cp -r curl-android-ios/curl/lib/android-arm64-v8a/* $HOME/imagine-sdk/android-libs/
          cp -r curl-android-ios/curl/include/* $HOME/imagine-sdk/include/

      - name: Build Imagine SDK
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd imagine
          ./android.sh install

      - name: Build EmuFramework
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd EmuFramework
          ./android.sh install

      - name: Build Snes9x EX+
        env:
          IMAGINE_PATH: ${{ github.workspace }}/imagine
          IMAGINE_SDK_PATH: ${{ github.workspace }}/imagine-sdk
        run: |
          cd Snes9x
          ./android.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snes9x-EX-Plus-Cloud-Edition
          path: Snes9x/build/android/src/main/outputs/apk/release/*.apk
